name: Release

on:
  push:
    branches:
      - main
      - Master

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          
      - name: Get package version
        id: package_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          
      - name: Install dependencies
        run: yarn install
        
      # 使用 package.json 中定义的构建命令
      - name: Build App
        run: yarn run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.os }}
          path: |
            release/${{ steps.package_version.outputs.version }}/*.exe
            release/${{ steps.package_version.outputs.version }}/*.msi
            release/${{ steps.package_version.outputs.version }}/*.dmg
            release/${{ steps.package_version.outputs.version }}/*.zip
            release/${{ steps.package_version.outputs.version }}/*.AppImage
            release/${{ steps.package_version.outputs.version }}/*.deb
            release/${{ steps.package_version.outputs.version }}/*.rpm
            .output/**/*
          retention-days: 5
          if-no-files-found: warn  # 改为 warn 避免因为某些平台没有特定格式而失败
          
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get package version
        id: package_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.package_version.outputs.version }}
          name: Release v${{ steps.package_version.outputs.version }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/.output/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
